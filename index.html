<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bất ngờ chưa bà già!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #countdown-container {
            transition: all 0.5s ease;
        }

        #number {
            font-size: 150px;
            font-weight: bold;
            color: #ff4757;
        }

        #message {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #surprise {
            display: none;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1.5); }
        }

        .emoji {
            font-size: 150px;
            display: block;
            margin-top: 20px;
        }

        h2 {
            font-size: 50px;
            color: #feca57;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="countdown-container">
        <div id="message">Món quà bất ngờ dành cho bạn trong...</div>
        <div id="number">5</div>
    </div>

    <div id="surprise">
        <h2>CÓ CÁI CON C**!</h2>
        <span class="emoji">🖕</span>
    </div>

    <script>
        let count = 5;
        const numberDisplay = document.getElementById('number');
        const countdownContainer = document.getElementById('countdown-container');
        const surpriseContainer = document.getElementById('surprise');

        const timer = setInterval(() => {
            count--;
            numberDisplay.innerText = count;

            if (count === 0) {
                clearInterval(timer);
                countdownContainer.style.display = 'none';
                surpriseContainer.style.display = 'block';
                
                // Rung màn hình khi hiện kết quả
                window.navigator.vibrate(500); 
            }
        }, 1000);
    </script>
</body>
</html>
